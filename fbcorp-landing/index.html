<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FBCorp — Building a Foundation for the Future</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #000000;
    --text: #f5f5f7;
    --text2: #86868b;
    --font: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  .glow {
    position: absolute;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(124,109,250,0.08) 0%, transparent 70%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    animation: pulse 6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
  }

  .content {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; text-align: center;
    padding: 0 24px;
    animation: fadeUp 1.2s ease forwards;
    opacity: 0;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .logo {
    height: 72px; width: auto;
    margin-bottom: 48px;
    filter: brightness(1.1);
  }

  .tagline {
    font-size: clamp(28px, 5vw, 56px);
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.15;
    max-width: 700px;
    background: linear-gradient(135deg, #f5f5f7 0%, #86868b 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 24px;
  }

  .sub {
    font-size: clamp(14px, 2vw, 18px);
    color: var(--text2);
    font-weight: 300;
    letter-spacing: 0.02em;
    max-width: 500px;
    line-height: 1.6;
    animation: fadeUp 1.2s ease 0.3s forwards;
    opacity: 0;
  }

  .divider {
    width: 40px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(124,109,250,0.5), transparent);
    margin: 40px 0;
    animation: fadeUp 1.2s ease 0.5s forwards;
    opacity: 0;
  }

  .footer {
    position: absolute;
    bottom: 32px;
    font-size: 12px;
    color: #3a3a3e;
    letter-spacing: 0.05em;
    animation: fadeUp 1.2s ease 0.7s forwards;
    opacity: 0;
  }


  /* ── Software cards ── */
  .products {
    display: flex; gap: 20px;
    margin-top: 48px;
    animation: fadeUp 1.2s ease 0.6s forwards;
    opacity: 0;
  }
  .product-card {
    width: 200px;
    padding: 28px 24px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    text-decoration: none;
    color: var(--text);
    transition: all 0.3s ease;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .product-card::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(124,109,250,0.06) 0%, transparent 70%);
    opacity: 0; transition: opacity 0.3s ease;
  }
  .product-card:hover::before { opacity: 1; }
  .product-card:hover {
    border-color: rgba(124,109,250,0.3);
    transform: translateY(-4px);
    box-shadow: 0 8px 30px rgba(124,109,250,0.08);
  }
  .product-icon {
    font-size: 28px; margin-bottom: 14px;
    display: block;
  }
  .product-name {
    font-size: 16px; font-weight: 600;
    margin-bottom: 6px;
    letter-spacing: -0.01em;
  }
  .product-desc {
    font-size: 12px; color: var(--text2);
    line-height: 1.5;
  }
  .product-arrow {
    position: absolute; bottom: 18px; right: 20px;
    font-size: 14px; color: rgba(124,109,250,0.4);
    transition: all 0.3s ease;
  }
  .product-card:hover .product-arrow {
    color: rgba(124,109,250,0.9);
    transform: translateX(3px);
  }

  @media (max-width: 480px) {
    .logo { height: 52px; margin-bottom: 36px; }
    .products { flex-direction: column; gap: 12px; }
    .product-card { width: 260px; }
  }

</style>
</head>
